# 默认不在开机时启动。KernelSU 模块“操作”按钮可显式开始/停止。
# 安全前提是 SELinux 已恢复 Enforcing；控制器拒绝在 Permissive 下启动。
ENABLE_AT_BOOT=${ENABLE_AT_BOOT:-0}

# 默认使用已实测的 6GHz 独立热点。5GHz 20/40/80MHz 是独立候选拓扑，
# 上游必须换到 LabNet-2.4G，并要求单独提供 reconnect-2g.key。
BAND=${BAND:-6g}
WIDTH=${WIDTH:-20}

# 自动看护上限。正常停止由 action/control 写入 cleanup.request 触发。
GUARDIAN_HOLD_SECONDS=${GUARDIAN_HOLD_SECONDS:-86400}

# Settings 只能通过固定协议请求 start(6g/20) 或 stop；worker 不暴露任意命令。
ENABLE_SETTINGS_BRIDGE=${ENABLE_SETTINGS_BRIDGE:-1}

# 上游模式：
#   auto（默认）每次启动按当前 STA 状态决定——
#     已连本频段文档上游（6g: LabNet-6G/6135）-> wifi
#     已连其它任一网络 -> wifi-any
#     未连任何网络 -> cell
#   wifi     已验证基线：STA 连在本频段文档上游，上游接口必须是 wlan0
#   wifi-any STA 连在别的网络上，上游 wlan0，不校验具体 SSID
#   cell     无 STA 连接（Wi-Fi 开关仍开着，驱动才在），蜂窝数据提供上游；
#            前置要求已开移动数据，Tethering 上游必须是 rmnet/wwan/ccmni/seth/eth
# 解析结果写入任务目录的 upstream.mode，看护与恢复按该记录执行。
MT6639_HOTSPOT_UPSTREAM=${MT6639_HOTSPOT_UPSTREAM:-auto}

# C02（2.4GHz HE 一次性验收）默认不碰 MIUI 的 Settings.System
# hotspot_80211ax_support。实测：不打开它时 framework 生成的
# hostapd_ap0.conf 是 ieee80211ax=0，SoftApInfo 报 wifiStandard=4（11n），
# 2.4GHz HE 验收必然失败。设为 1 时仅在试验期内临时打开，恢复阶段按
# 快照写回原值（原值为 null 则删除该键）。
MT6639_C02_FORCE_AX=${MT6639_C02_FORCE_AX:-0}
