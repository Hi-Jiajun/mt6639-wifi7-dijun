# MT6639 6GHz 实验开关配置
#
# 用户选择默认启用：KernelSU service 就绪后启动有看护的持续 6GHz 事务。
# 手动恢复、禁用/移除模块、看护收到 TERM/INT 时恢复；不会每 15 分钟重置 Wi-Fi。
#
# 启用前必须满足：boot/内核/原厂 cfg/原厂 ko 四项哈希与本机锁定的版本一致。
# 任何一项不符，apply 直接拒绝，不会尝试"尽量适配"。

# 0=关闭 1=启用（默认）
# 允许环境变量临时覆盖，便于单次实验与测试；文件值仍是持久默认。
ENABLE_6G=${ENABLE_6G:-1}

# persistent=持续（默认）；bounded=旧版 15 分钟实验窗口。
RUN_MODE=${RUN_MODE:-persistent}

# 实验期间保持 Wi-Fi 可用；脚本会自行做关闭/开启周期，不需要手工操作。
SCAN_ALWAYS_WAS_ENABLED=1
